# Pushing a tag like v1.2.3 builds all platforms with scripts/build.sh (which
# also runs svelte-check, go vet and go test) and publishes a GitHub release.
# Tags with a hyphen (v1.2.3-rc.1) become pre-releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        run: scripts/build.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Publish release
        run: |
          flags="--generate-notes --verify-tag"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" dist/devca-* dist/SHA256SUMS --title "DevCA $TAG" $flags
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
